; extensions_alerts.conf — outbound alert dialplan for call_trigger.py
; Included from extensions.conf. Fed by call files that call_trigger.py drops
; into /var/spool/asterisk/outgoing/.
;
;   POST /ha  -> Local/<phone>@ha-outbound  + Context: tts-alerts, Exten: s
;               (rings <phone> out the trunk; plays the pre-synthesised wav)
;   POST /    -> Local/999@from-ha-alerts   + Application: Playback (Uptime Kuma)
;
; Nothing here is hardcoded to a specific box. The outbound trunk name arrives
; from the producer as ${HA_TRUNK} and must match a configured PJSIP endpoint on
; this machine. If it is empty the call is dropped rather than sent somewhere
; unintended.

[ha-outbound]
; The dialing half of the HA alert. <phone> = the call file's channel; the trunk
; = ${HA_TRUNK}, chosen in Home Assistant.
exten => _X.,1,NoOp(HA alert -> ${EXTEN} via trunk ${HA_TRUNK})
 same => n,GotoIf($["${HA_TRUNK}" = ""]?notrunk)
 same => n,Dial(PJSIP/${EXTEN}@${HA_TRUNK},60)
 same => n,Hangup()
 same => n(notrunk),NoOp(no HA_TRUNK supplied — alert call dropped)
 same => n,Hangup()

[tts-alerts]
; The message half: plays the wav that call_trigger.py synthesised BEFORE the
; call was placed (instant speech on answer; content-hash cached). ALERT_FILE
; is a hash-named /tmp path built by call_trigger — never producer text — and
; nothing here shells out. Stale /tmp/alert_*.wav files are swept by
; call_trigger.py itself, so no h-extension cleanup is needed.
exten => s,1,NoOp(TTS alert: ${ALERT_FILE})
 same => n,GotoIf($["${ALERT_FILE}" = ""]?drop)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${ALERT_FILE})
 same => n,Hangup()
 same => n(drop),NoOp(no ALERT_FILE supplied — alert dropped)
 same => n,Hangup()

[from-ha-alerts]
; Uptime Kuma leg: dial the admin so someone hears the pre-synthesised wav that
; the call file's Playback plays. Both values come from extensions.conf [globals]:
;   ALERT_ADMIN = phone number to ring;  ALERT_TRUNK = PJSIP endpoint to dial out.
; Dropped safely until both are set.
; No semicolon inside NoOp(): it opens a comment, the parser never sees
; the closing bracket, and every dialplan reload logs a warning.
exten => 999,1,NoOp(Kuma alert - admin=${ALERT_ADMIN} trunk=${ALERT_TRUNK})
 same => n,GotoIf($["${ALERT_ADMIN}" = ""]?drop)
 same => n,GotoIf($["${ALERT_TRUNK}" = ""]?drop)
 same => n,Dial(PJSIP/${ALERT_ADMIN}@${ALERT_TRUNK},60)
 same => n,Hangup()
 same => n(drop),NoOp(ALERT_ADMIN/ALERT_TRUNK not set — Kuma call dropped)
 same => n,Hangup()
